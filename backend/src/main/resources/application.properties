spring.application.name=novaid-backend

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/novaid?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Server
server.port=8080

# Free local Ollama AI configuration. Install Ollama and run: ollama run qwen2.5:3b
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:http://localhost:11434/v1}
openai.model=${OPENAI_MODEL:qwen2.5:3b}
